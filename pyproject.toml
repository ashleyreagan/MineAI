[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineai"
version = "0.2.0"
description = "Turn scanned historic mine maps into georeferenced, reviewable GIS candidates (OCR + mine-entry detection)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ashley Mitchell" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.24,<3",
  "rasterio>=1.3.9,<2",
  "pyproj>=3.5,<4",
  "shapely>=2.0,<3",
  "geopandas>=0.14,<2",
  "pillow>=10,<13",
  "pytesseract>=0.3.10,<0.4",
  "pyyaml>=6,<7",
  "rich>=13,<15",
]

[project.optional-dependencies]
detect = ["ultralytics>=8.1,<9"]
gui = ["streamlit>=1.50,<2", "folium>=0.15,<1", "pandas>=2,<3"]
dev = ["pytest>=7", "scipy>=1.10"]

[project.scripts]
mineai = "mineai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: large-raster tests (deselect with -m 'not slow')"]
